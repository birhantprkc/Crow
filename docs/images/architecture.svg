<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1320" width="2000" height="1320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .zone      { rx:14; ry:14; }
      .t         { font-size:15px; fill:#1f2933; }
      .tb        { font-size:15px; fill:#1f2933; font-weight:600; }
      .sub       { font-size:12.5px; fill:#66727f; }
      .subw      { font-size:12.5px; fill:#ffffff; opacity:.85; }
      .zh        { font-size:16px; font-weight:700; letter-spacing:.6px; }
      .num       { font-size:15px; font-weight:700; fill:#ffffff; }
      .big       { font-size:38px; font-weight:800; fill:#0b0e17; letter-spacing:.5px; }
      .tag       { font-size:13.5px; fill:#66727f; letter-spacing:1.6px; }
      .lg        { font-size:13px; fill:#4b5563; }
      .mono      { font-family:"Cascadia Mono","Consolas",monospace; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c8794"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/>
    </marker>
  </defs>

  <rect width="2000" height="1320" fill="#ffffff"/>

  <!-- ── header ───────────────────────────────────────────────────────────── -->
  <rect x="40" y="34" width="62" height="62" rx="13" fill="#2c5bac"/>
  <text x="71" y="77" text-anchor="middle" class="num" font-size="34">C</text>
  <text x="120" y="70" class="big">CROW ENGINE</text>
  <text x="122" y="93" class="tag">284B PARAMETERS · 13B ACTIVE PER TOKEN · 43 LAYERS · 256 EXPERTS EACH · ONE CONSUMER GPU</text>

  <rect x="1580" y="34" width="380" height="62" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="1770" y="60" text-anchor="middle" class="tb" fill="#475569">HOST RAM: 1.28 GiB</text>
  <text x="1770" y="80" text-anchor="middle" class="sub">the 95.9 GiB model never lives here</text>

  <!-- ── the four decisions ───────────────────────────────────────────────── -->
  <g>
    <rect x="40" y="118" width="460" height="70" rx="11" fill="#f2fbf5" stroke="#69c98a"/>
    <circle cx="76" cy="153" r="16" fill="#2f9e5e"/><text x="76" y="158" text-anchor="middle" class="num">1</text>
    <text x="104" y="147" class="tb">QUANTISATION</text>
    <text x="104" y="169" class="sub">UD-IQ3_XXS — 376.9 MiB per token</text>

    <rect x="524" y="118" width="460" height="70" rx="11" fill="#f2fbf5" stroke="#69c98a"/>
    <circle cx="560" cy="153" r="16" fill="#2f9e5e"/><text x="560" y="158" text-anchor="middle" class="num">2</text>
    <text x="588" y="147" class="tb">SPARSE ROUTING</text>
    <text x="588" y="169" class="sub">6 of 256 experts fire per layer</text>

    <rect x="1008" y="118" width="460" height="70" rx="11" fill="#f2fbf5" stroke="#69c98a"/>
    <circle cx="1044" cy="153" r="16" fill="#2f9e5e"/><text x="1044" y="158" text-anchor="middle" class="num">3</text>
    <text x="1072" y="147" class="tb">VRAM SLOT CACHE</text>
    <text x="1072" y="169" class="sub">64 of 256 resident, ~70 % hit rate</text>

    <rect x="1492" y="118" width="468" height="70" rx="11" fill="#f2fbf5" stroke="#69c98a"/>
    <circle cx="1528" cy="153" r="16" fill="#2f9e5e"/><text x="1528" y="158" text-anchor="middle" class="num">4</text>
    <text x="1556" y="147" class="tb">UNBUFFERED READ</text>
    <text x="1556" y="169" class="sub">O_DIRECT, one handle per worker</text>
  </g>

  <!-- ── zone: resident in VRAM ───────────────────────────────────────────── -->
  <rect x="40" y="212" width="1920" height="392" rx="14" fill="#f5f9ff" stroke="#5b8def"/>
  <text x="1000" y="240" text-anchor="middle" class="zh" fill="#2c5bac">RESIDENT IN VRAM — 31,838 of 32,607 MiB measured at the operating point</text>

  <!-- pipeline row -->
  <rect x="66" y="262" width="150" height="76" rx="11" fill="#ffffff" stroke="#8b5cf6"/>
  <text x="141" y="292" text-anchor="middle" class="tb">PROMPT</text>
  <text x="141" y="313" text-anchor="middle" class="sub">cli/crow.py</text>

  <rect x="248" y="262" width="176" height="76" rx="11" fill="#ffffff" stroke="#5b8def"/>
  <text x="336" y="292" text-anchor="middle" class="tb">llama-server</text>
  <text x="336" y="313" text-anchor="middle" class="sub">/v1/chat/completions</text>

  <!-- the layer stack -->
  <rect x="456" y="248" width="700" height="230" rx="12" fill="#fffdf5" stroke="#f0a72a"/>
  <text x="806" y="273" text-anchor="middle" class="tb" fill="#b8770a">43-LAYER MIXTURE-OF-EXPERTS STACK</text>

  <rect x="480" y="290" width="180" height="72" rx="10" fill="#ffffff" stroke="#5b8def"/>
  <text x="570" y="316" text-anchor="middle" class="tb">ATTENTION</text>
  <text x="570" y="336" text-anchor="middle" class="sub">MLA, norms, shared</text>

  <rect x="686" y="290" width="150" height="72" rx="10" fill="#ffffff" stroke="#f0a72a"/>
  <text x="761" y="316" text-anchor="middle" class="tb">ROUTER</text>
  <text x="761" y="336" text-anchor="middle" class="sub">top-6 of 256</text>

  <rect x="866" y="290" width="166" height="72" rx="10" fill="#fff5f5" stroke="#e5484d"/>
  <text x="949" y="311" text-anchor="middle" class="tb">EXPERT GEMM</text>
  <text x="949" y="330" text-anchor="middle" class="sub">on CUDA, from the</text>
  <text x="949" y="348" text-anchor="middle" class="sub">slot that holds it</text>

  <rect x="480" y="386" width="552" height="70" rx="10" fill="#faf7ff" stroke="#8b5cf6"/>
  <text x="756" y="412" text-anchor="middle" class="tb">EXPERT SLOT CACHE — 64 slots per layer, ~24 GiB</text>
  <text x="756" y="434" text-anchor="middle" class="sub">hit: the weights are already here · miss: fetch, and the compute thread waits</text>

  <rect x="1188" y="262" width="164" height="76" rx="11" fill="#ffffff" stroke="#5b8def"/>
  <text x="1270" y="292" text-anchor="middle" class="tb">SAMPLE</text>
  <text x="1270" y="313" text-anchor="middle" class="sub">temperature 0.6</text>

  <rect x="1384" y="262" width="176" height="76" rx="11" fill="#ffffff" stroke="#8b5cf6"/>
  <text x="1472" y="285" text-anchor="middle" class="tb">STREAM OUT</text>
  <text x="1472" y="304" text-anchor="middle" class="sub">reasoning_content,</text>
  <text x="1472" y="322" text-anchor="middle" class="sub">then content</text>

  <rect x="1592" y="262" width="344" height="76" rx="11" fill="#ffffff" stroke="#2f9e5e"/>
  <text x="1764" y="292" text-anchor="middle" class="tb">12.08 tok/s decode · 14.43 prefill</text>
  <text x="1764" y="313" text-anchor="middle" class="sub">median of 18 graded answers</text>

  <!-- KV cache -->
  <rect x="1188" y="386" width="372" height="70" rx="10" fill="#faf7ff" stroke="#8b5cf6"/>
  <text x="1374" y="412" text-anchor="middle" class="tb">KV CACHE — 200k context on ONE slot</text>
  <text x="1374" y="434" text-anchor="middle" class="sub">~1.41 GiB · 7.05 KiB per token, compressed attention</text>

  <rect x="1592" y="386" width="344" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="1764" y="412" text-anchor="middle" class="tb" fill="#475569">RESIDENT WEIGHTS — 6.57 GiB</text>
  <text x="1764" y="434" text-anchor="middle" class="sub">7.3 % of the file, touched by every token</text>

  <!-- arrows across the pipeline -->
  <g stroke="#7c8794" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M216,300 L244,300"/>
    <path d="M424,300 L452,300"/>
    <path d="M660,326 L682,326"/>
    <path d="M836,326 L862,326"/>
    <path d="M1156,300 L1184,300"/>
    <path d="M1352,300 L1380,300"/>
    <path d="M1560,300 L1588,300"/>
  </g>
  <g stroke="#7c8794" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#a)">
    <path d="M949,386 L949,366"/>
    <path d="M761,366 L761,384"/>
  </g>

  <text x="66" y="576" class="sub">The host holds no model weights. What is resident is the 7.3 % every token touches, plus whichever experts the cache currently holds.</text>

  <!-- ── zone: the boundary ───────────────────────────────────────────────── -->
  <rect x="40" y="626" width="1920" height="132" rx="14" fill="#fff7f0" stroke="#e8590c"/>
  <text x="66" y="656" class="zh" fill="#e8590c">MEMORY BOUNDARY</text>
  <text x="66" y="678" class="sub">what crosses it, per token</text>

  <rect x="300" y="644" width="380" height="94" rx="11" fill="#ffffff" stroke="#e8590c"/>
  <text x="490" y="674" text-anchor="middle" class="tb">MISS → ONE WORK ITEM PER TENSOR</text>
  <text x="490" y="696" text-anchor="middle" class="sub">not one per expert — that is where the</text>
  <text x="490" y="714" text-anchor="middle" class="sub">queue depth comes from</text>

  <rect x="712" y="644" width="380" height="94" rx="11" fill="#ffffff" stroke="#e8590c"/>
  <text x="902" y="674" text-anchor="middle" class="tb">8 I/O WORKERS, 8 HANDLES</text>
  <text x="902" y="696" text-anchor="middle" class="sub">Windows serialises on the file object,</text>
  <text x="902" y="714" text-anchor="middle" class="sub">so a shared handle stays at depth 1</text>

  <rect x="1124" y="644" width="380" height="94" rx="11" fill="#ffffff" stroke="#e8590c"/>
  <text x="1314" y="674" text-anchor="middle" class="tb">UPLOAD UNDER ONE MUTEX</text>
  <text x="1314" y="696" text-anchor="middle" class="sub">the read stays outside it — that is</text>
  <text x="1314" y="714" text-anchor="middle" class="sub">where the throughput lives</text>

  <rect x="1536" y="644" width="400" height="94" rx="11" fill="#fff0e6" stroke="#e8590c"/>
  <text x="1736" y="672" text-anchor="middle" class="tb" fill="#e8590c">376.9 MiB / TOKEN</text>
  <text x="1736" y="694" text-anchor="middle" class="sub">queue depth 4.31 · 4,585 MB/s</text>
  <text x="1736" y="714" text-anchor="middle" class="sub">79 % of a request is waiting on this</text>

  <g stroke="#e8590c" stroke-width="2" fill="none" marker-end="url(#ao)">
    <path d="M680,690 L708,690"/>
    <path d="M1092,690 L1120,690"/>
    <path d="M1504,690 L1532,690"/>
  </g>
  <g stroke="#e8590c" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#ao)" marker-start="url(#ao)">
    <path d="M490,644 L490,470"/>
    <path d="M1314,738 L1314,800"/>
  </g>

  <!-- ── zone: on NVMe ────────────────────────────────────────────────────── -->
  <rect x="40" y="800" width="1920" height="236" rx="14" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="66" y="830" class="zh" fill="#475569">ON NVMe — NOT RESIDENT</text>

  <rect x="66" y="852" width="420" height="160" rx="11" fill="#ffffff" stroke="#94a3b8"/>
  <text x="276" y="882" text-anchor="middle" class="tb">THE MODEL FILE</text>
  <text x="276" y="908" text-anchor="middle" class="sub">DeepSeek-V4-Flash, UD-IQ3_XXS</text>
  <text x="276" y="930" text-anchor="middle" class="sub">95.9 GiB across 4 files</text>
  <text x="276" y="952" text-anchor="middle" class="sub">92.7 % of it is routed experts</text>
  <text x="276" y="980" text-anchor="middle" class="sub mono">fetched by the user, never shipped</text>

  <rect x="518" y="852" width="700" height="160" rx="11" fill="#ffffff" stroke="#94a3b8"/>
  <text x="868" y="882" text-anchor="middle" class="tb">EXPERT POOL — 11,008 per model, 256 per layer</text>
  <g fill="#cbd5e1">
    <g id="row">
      <rect x="556" y="906" width="26" height="26" rx="5"/><rect x="592" y="906" width="26" height="26" rx="5"/>
      <rect x="628" y="906" width="26" height="26" rx="5"/><rect x="664" y="906" width="26" height="26" rx="5"/>
      <rect x="700" y="906" width="26" height="26" rx="5"/><rect x="736" y="906" width="26" height="26" rx="5"/>
      <rect x="772" y="906" width="26" height="26" rx="5"/><rect x="808" y="906" width="26" height="26" rx="5"/>
      <rect x="844" y="906" width="26" height="26" rx="5"/><rect x="880" y="906" width="26" height="26" rx="5"/>
      <rect x="916" y="906" width="26" height="26" rx="5"/><rect x="952" y="906" width="26" height="26" rx="5"/>
      <rect x="988" y="906" width="26" height="26" rx="5"/><rect x="1024" y="906" width="26" height="26" rx="5"/>
      <rect x="1060" y="906" width="26" height="26" rx="5"/><rect x="1096" y="906" width="26" height="26" rx="5"/>
      <rect x="1132" y="906" width="26" height="26" rx="5"/>
    </g>
  </g>
  <g fill="#e5484d">
    <rect x="628" y="906" width="26" height="26" rx="5"/><rect x="736" y="906" width="26" height="26" rx="5"/>
    <rect x="844" y="906" width="26" height="26" rx="5"/><rect x="916" y="906" width="26" height="26" rx="5"/>
    <rect x="1024" y="906" width="26" height="26" rx="5"/><rect x="1096" y="906" width="26" height="26" rx="5"/>
  </g>
  <text x="868" y="964" text-anchor="middle" class="sub">red: the 6 this token woke · grey: the 250 it did not</text>
  <text x="868" y="988" text-anchor="middle" class="sub">the cache holds 64 of them; a cold first touch cannot be cached away</text>

  <rect x="1250" y="852" width="330" height="160" rx="11" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="1415" y="882" text-anchor="middle" class="tb" fill="#475569">PAGE CACHE</text>
  <text x="1415" y="908" text-anchor="middle" class="sub">bypassed on purpose</text>
  <text x="1415" y="932" text-anchor="middle" class="sub">FILE_FLAG_NO_BUFFERING</text>
  <text x="1415" y="956" text-anchor="middle" class="sub">mmap faults reach 707 MB/s;</text>
  <text x="1415" y="980" text-anchor="middle" class="sub">this path reaches 10,533</text>
  <line x1="1266" y1="1000" x2="1564" y2="866" stroke="#94a3b8" stroke-width="2"/>

  <rect x="1612" y="852" width="324" height="160" rx="11" fill="#ffffff" stroke="#2f9e5e"/>
  <text x="1774" y="882" text-anchor="middle" class="tb" fill="#2f9e5e">AGAINST CPU OFFLOAD</text>
  <text x="1774" y="912" text-anchor="middle" class="sub">decode 11.03 vs 8.18 tok/s</text>
  <text x="1774" y="936" text-anchor="middle" class="sub">prefill 9.47 vs 4.43 tok/s</text>
  <text x="1774" y="960" text-anchor="middle" class="sub">host RAM 1.28 vs 51.79 GiB</text>
  <text x="1774" y="988" text-anchor="middle" class="sub">same binary, placement the only change</text>

  <!-- ── legend ───────────────────────────────────────────────────────────── -->
  <rect x="40" y="1058" width="1920" height="52" rx="11" fill="#ffffff" stroke="#e2e8f0"/>
  <g class="lg">
    <circle cx="76"  cy="1084" r="7" fill="#8b5cf6"/><text x="92"  y="1089">client / state</text>
    <circle cx="228" cy="1084" r="7" fill="#5b8def"/><text x="244" y="1089">pipeline</text>
    <circle cx="352" cy="1084" r="7" fill="#f0a72a"/><text x="368" y="1089">layer internals</text>
    <circle cx="508" cy="1084" r="7" fill="#e5484d"/><text x="524" y="1089">experts</text>
    <circle cx="624" cy="1084" r="7" fill="#e8590c"/><text x="640" y="1089">crossing the boundary</text>
    <circle cx="836" cy="1084" r="7" fill="#94a3b8"/><text x="852" y="1089">storage</text>
    <circle cx="952" cy="1084" r="7" fill="#2f9e5e"/><text x="968" y="1089">measured result</text>
    <text x="1120" y="1089" fill="#66727f">Every figure on this diagram is measured on one RTX 5090, 63.4 GB RAM, one NVMe. Sources in the README.</text>
  </g>

  <!-- ── footnote ─────────────────────────────────────────────────────────── -->
  <text x="40" y="1160" class="sub">The whole trick in one line: a token needs 6 of 256 experts per layer, so 92.7 % of the file can stay on the drive — as long as fetching it</text>
  <text x="40" y="1182" class="sub">is fast enough that the GPU does not idle waiting. That is what the four decisions above buy, and what the 376.9 MiB per token costs.</text>
  <text x="40" y="1228" class="sub mono" fill="#94a3b8">measured 2026-08-07/08 · UD-IQ3_XXS · -c 200000 -ngl 99 -np 1 --moe-stream --moe-stream-cache 64s --moe-stream-io-threads 8 --moe-stream-direct</text>
</svg>
