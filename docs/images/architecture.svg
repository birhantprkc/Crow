<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2216" width="1200" height="2216" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .t    { font-size:21px; fill:#1f2933; }
      .tb   { font-size:21px; fill:#1f2933; font-weight:600; }
      .sub  { font-size:17px; fill:#5d6b7a; }
      .zh   { font-size:24px; font-weight:700; letter-spacing:.4px; }
      .num  { font-size:22px; font-weight:700; fill:#ffffff; }
      .big  { font-size:52px; font-weight:800; fill:#0b0e17; letter-spacing:.5px; }
      .tag  { font-size:18px; fill:#5d6b7a; letter-spacing:1.2px; }
      .lg   { font-size:17px; fill:#4b5563; }
      .huge { font-size:30px; font-weight:800; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c8794"/>
    </marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/>
    </marker>
  </defs>

  <rect width="1200" height="2216" fill="#ffffff"/>

  <!-- ══ header ══════════════════════════════════════════════════════════ -->
  <rect x="34" y="30" width="76" height="76" rx="16" fill="#2c5bac"/>
  <!-- dominant-baseline rather than a hand-computed baseline: the cap height of
       one glyph is not something to guess at, and the renderer knows it. -->
  <text x="72" y="68" text-anchor="middle" dominant-baseline="central" class="num" font-size="42">C</text>
  <text x="130" y="76" class="big">CROW ENGINE</text>
  <text x="132" y="102" class="tag">284B PARAMETERS · 13B ACTIVE PER TOKEN · 43 LAYERS · 256 EXPERTS EACH</text>

  <rect x="34" y="126" width="1132" height="66" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 5"/>
  <text x="600" y="153" text-anchor="middle" class="tb" fill="#475569">HOST RAM: 33.73 GiB peak — 32 of them the expert tier · the 95.9 GiB model never lives here</text>
  <text x="600" y="180" text-anchor="middle" class="sub">llama.cpp's CPU offload needs 51.79 GiB for the same work, on the same binary</text>

  <!-- ══ the four decisions ══════════════════════════════════════════════ -->
  <g>
    <rect x="34" y="216" width="556" height="92" rx="12" fill="#f2fbf5" stroke="#69c98a" stroke-width="1.6"/>
    <circle cx="76" cy="262" r="21" fill="#2f9e5e"/><text x="76" y="270" text-anchor="middle" class="num">1</text>
    <text x="110" y="255" class="tb">QUANTISATION</text>
    <text x="110" y="283" class="sub">UD-IQ3_XXS — 376.9 MiB moved per token</text>

    <rect x="610" y="216" width="556" height="92" rx="12" fill="#f2fbf5" stroke="#69c98a" stroke-width="1.6"/>
    <circle cx="652" cy="262" r="21" fill="#2f9e5e"/><text x="652" y="270" text-anchor="middle" class="num">2</text>
    <text x="686" y="255" class="tb">SPARSE ROUTING</text>
    <text x="686" y="283" class="sub">6 of 256 experts fire per layer</text>

    <rect x="34" y="322" width="556" height="92" rx="12" fill="#f2fbf5" stroke="#69c98a" stroke-width="1.6"/>
    <circle cx="76" cy="368" r="21" fill="#2f9e5e"/><text x="76" y="376" text-anchor="middle" class="num">3</text>
    <text x="110" y="361" class="tb">VRAM SLOT CACHE</text>
    <text x="110" y="389" class="sub">64 of 256 resident — 80–82 % on the gate</text>

    <rect x="610" y="322" width="556" height="92" rx="12" fill="#f2fbf5" stroke="#69c98a" stroke-width="1.6"/>
    <circle cx="652" cy="368" r="21" fill="#2f9e5e"/><text x="652" y="376" text-anchor="middle" class="num">4</text>
    <text x="686" y="361" class="tb">UNBUFFERED READ</text>
    <text x="686" y="389" class="sub">O_DIRECT, one file handle per worker</text>
  </g>

  <!-- ══ zone 1: resident in VRAM ════════════════════════════════════════ -->
  <rect x="34" y="446" width="1132" height="676" rx="16" fill="#f5f9ff" stroke="#5b8def" stroke-width="2"/>
  <text x="600" y="486" text-anchor="middle" class="zh" fill="#2c5bac">RESIDENT IN VRAM</text>
  <text x="600" y="514" text-anchor="middle" class="sub">32,008 of 32,607 MiB, measured at the operating point</text>

  <!-- pipeline, two rows -->
  <rect x="66" y="540" width="240" height="86" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="186" y="574" text-anchor="middle" class="tb">PROMPT</text>
  <text x="186" y="600" text-anchor="middle" class="sub">cli/crow.py</text>

  <rect x="366" y="540" width="290" height="86" rx="12" fill="#ffffff" stroke="#5b8def" stroke-width="1.8"/>
  <text x="511" y="574" text-anchor="middle" class="tb">llama-server</text>
  <text x="511" y="600" text-anchor="middle" class="sub">/v1/chat/completions</text>

  <rect x="716" y="540" width="418" height="86" rx="12" fill="#f2fbf5" stroke="#2f9e5e" stroke-width="1.8"/>
  <text x="925" y="573" text-anchor="middle" class="tb" fill="#2f9e5e">14.73 tok/s decode</text>
  <text x="925" y="600" text-anchor="middle" class="sub">median of three paired runs · 1.40–1.47x</text>

  <g stroke="#7c8794" stroke-width="2.4" fill="none" marker-end="url(#a)">
    <path d="M306,583 L360,583"/>
    <path d="M656,583 L710,583"/>
  </g>

  <!-- the layer stack -->
  <rect x="66" y="656" width="1068" height="270" rx="14" fill="#fffdf5" stroke="#f0a72a" stroke-width="1.8"/>
  <text x="600" y="690" text-anchor="middle" class="tb" fill="#b8770a">43-LAYER MIXTURE-OF-EXPERTS STACK — repeated for every token</text>

  <rect x="94" y="712" width="292" height="98" rx="11" fill="#ffffff" stroke="#5b8def" stroke-width="1.6"/>
  <text x="240" y="748" text-anchor="middle" class="tb">ATTENTION + NORMS</text>
  <text x="240" y="775" text-anchor="middle" class="sub">6.57 GiB, always resident</text>
  <text x="240" y="798" text-anchor="middle" class="sub">7.3 % of the file</text>

  <rect x="418" y="712" width="240" height="98" rx="11" fill="#ffffff" stroke="#f0a72a" stroke-width="1.6"/>
  <text x="538" y="748" text-anchor="middle" class="tb">ROUTER</text>
  <text x="538" y="775" text-anchor="middle" class="sub">picks top 6</text>
  <text x="538" y="798" text-anchor="middle" class="sub">of 256</text>

  <rect x="690" y="712" width="416" height="98" rx="11" fill="#fff5f5" stroke="#e5484d" stroke-width="1.6"/>
  <text x="898" y="748" text-anchor="middle" class="tb">EXPERT GEMM on CUDA</text>
  <text x="898" y="775" text-anchor="middle" class="sub">reads the weights out of the slot</text>
  <text x="898" y="798" text-anchor="middle" class="sub">that currently holds that expert</text>

  <rect x="94" y="836" width="1012" height="72" rx="11" fill="#faf7ff" stroke="#8b5cf6" stroke-width="1.6"/>
  <text x="600" y="868" text-anchor="middle" class="tb">EXPERT SLOT CACHE — 64 slots per layer, ~24 GiB</text>
  <text x="600" y="894" text-anchor="middle" class="sub">hit: the weights are already here · miss: fetch them, and the compute thread waits</text>

  <g stroke="#7c8794" stroke-width="2.4" fill="none" marker-end="url(#a)">
    <path d="M386,761 L412,761"/>
    <path d="M658,761 L684,761"/>
  </g>
  <g stroke="#8b5cf6" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#a)">
    <path d="M898,836 L898,814"/>
  </g>

  <!-- KV + resident -->
  <rect x="66" y="950" width="528" height="94" rx="12" fill="#faf7ff" stroke="#8b5cf6" stroke-width="1.6"/>
  <text x="330" y="984" text-anchor="middle" class="tb">KV CACHE — 200k context, ONE slot</text>
  <text x="330" y="1010" text-anchor="middle" class="sub">~1.41 GiB · 7.05 KiB per token</text>
  <text x="330" y="1033" text-anchor="middle" class="sub">compressed attention makes context cheap</text>

  <rect x="618" y="950" width="516" height="94" rx="12" fill="#ffffff" stroke="#5b8def" stroke-width="1.6"/>
  <text x="876" y="984" text-anchor="middle" class="tb">STREAM OUT</text>
  <text x="876" y="1010" text-anchor="middle" class="sub">88.2 % of what the model writes is</text>
  <text x="876" y="1033" text-anchor="middle" class="sub">reasoning, and the raven shows it</text>

  <text x="600" y="1088" text-anchor="middle" class="sub">The GPU holds no whole model. What is resident is the 7.3 % every token touches, plus whichever</text>
  <text x="600" y="1110" text-anchor="middle" class="sub">experts the cache currently holds. Everything else stays on the drive.</text>

  <!-- ══ zone 2: the boundary ════════════════════════════════════════════ -->
  <rect x="34" y="1152" width="1132" height="376" rx="16" fill="#fff7f0" stroke="#e8590c" stroke-width="2"/>
  <text x="600" y="1192" text-anchor="middle" class="zh" fill="#e8590c">MEMORY BOUNDARY — what a cache miss costs</text>

  <rect x="66" y="1218" width="340" height="122" rx="12" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
  <text x="236" y="1252" text-anchor="middle" class="tb">ONE ITEM PER TENSOR</text>
  <text x="236" y="1280" text-anchor="middle" class="sub">not one per expert. An expert</text>
  <text x="236" y="1303" text-anchor="middle" class="sub">carries 2–3 weight tensors, and</text>
  <text x="236" y="1326" text-anchor="middle" class="sub">a loop keeps one read in flight</text>

  <rect x="430" y="1218" width="340" height="122" rx="12" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
  <text x="600" y="1252" text-anchor="middle" class="tb">8 WORKERS, 8 HANDLES</text>
  <text x="600" y="1280" text-anchor="middle" class="sub">Windows serialises on the file</text>
  <text x="600" y="1303" text-anchor="middle" class="sub">object, so a shared handle stays</text>
  <text x="600" y="1326" text-anchor="middle" class="sub">at depth 1 however many threads</text>

  <rect x="794" y="1218" width="340" height="122" rx="12" fill="#ffffff" stroke="#e8590c" stroke-width="1.6"/>
  <text x="964" y="1252" text-anchor="middle" class="tb">UPLOAD UNDER A MUTEX</text>
  <text x="964" y="1280" text-anchor="middle" class="sub">the disk read stays outside it —</text>
  <text x="964" y="1303" text-anchor="middle" class="sub">that is where the throughput is,</text>
  <text x="964" y="1326" text-anchor="middle" class="sub">and reproducibility came back</text>

  <g stroke="#e8590c" stroke-width="2.4" fill="none" marker-end="url(#ao)">
    <path d="M406,1279 L424,1279"/>
    <path d="M770,1279 L788,1279"/>
  </g>

  <rect x="66" y="1366" width="1068" height="128" rx="12" fill="#fff0e6" stroke="#e8590c" stroke-width="1.8"/>
  <text x="366" y="1408" text-anchor="middle" class="huge" fill="#e8590c">376.9 MiB</text>
  <text x="366" y="1436" text-anchor="middle" class="sub">moved per token</text>
  <text x="600" y="1408" text-anchor="middle" class="huge" fill="#e8590c">4.31</text>
  <text x="600" y="1436" text-anchor="middle" class="sub">reads in flight (pre-mutex)</text>
  <text x="834" y="1408" text-anchor="middle" class="huge" fill="#e8590c">56–59 %</text>
  <text x="834" y="1436" text-anchor="middle" class="sub">of decode is this wait</text>
  <text x="600" y="1462" text-anchor="middle" class="sub">The GPU idled three quarters of the time when this was measured, before the tier existed.</text>
  <text x="600" y="1486" text-anchor="middle" class="sub">Latency-bound, not compute-bound and not bandwidth-bound.</text>

  <!-- ══ zone 2b: the optional host tier ═════════════════════════════════ -->
  <rect x="34" y="1558" width="1132" height="200" rx="16" fill="#f0fbfa" stroke="#0f766e" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="600" y="1598" text-anchor="middle" class="zh" fill="#0f766e">HOST RAM TIER — 32 GiB of the host, at the operating point</text>

  <rect x="66" y="1622" width="520" height="112" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
  <text x="326" y="1656" text-anchor="middle" class="tb">--moe-stream-l2 32</text>
  <text x="326" y="1684" text-anchor="middle" class="sub">32 GiB of page-locked host memory,</text>
  <text x="326" y="1707" text-anchor="middle" class="sub">7,695 slots. The read lands here, so</text>
  <text x="326" y="1730" text-anchor="middle" class="sub">filling it costs nothing extra</text>

  <rect x="614" y="1622" width="520" height="112" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/>
  <text x="874" y="1652" text-anchor="middle" class="huge" fill="#2f9e5e">56.7 µs</text>
  <text x="874" y="1680" text-anchor="middle" class="sub">a miss served from here, against</text>
  <text x="874" y="1703" text-anchor="middle" class="sub">401.5 µs from the drive — 7.08x</text>
  <text x="874" y="1730" text-anchor="middle" class="sub" fill="#2f9e5e">1.40–1.47x decode, three paired runs</text>

  <g stroke="#0f766e" stroke-width="2.4" fill="none" marker-end="url(#ao)">
    <path d="M590,1678 L608,1678"/>
  </g>

  <!-- ══ zone 3: on NVMe ═════════════════════════════════════════════════ -->
  <rect x="34" y="1794" width="1132" height="286" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="600" y="1834" text-anchor="middle" class="zh" fill="#475569">ON NVMe — NOT RESIDENT</text>

  <rect x="66" y="1860" width="380" height="188" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="256" y="1896" text-anchor="middle" class="tb">THE MODEL FILE</text>
  <text x="256" y="1928" text-anchor="middle" class="sub">DeepSeek-V4-Flash, UD-IQ3_XXS</text>
  <text x="256" y="1954" text-anchor="middle" class="sub">95.9 GiB across four files</text>
  <text x="256" y="1980" text-anchor="middle" class="sub">92.7 % of it is routed experts</text>
  <text x="256" y="2018" text-anchor="middle" class="sub" fill="#94a3b8">fetched by the user, never shipped</text>

  <rect x="470" y="1860" width="664" height="188" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="802" y="1896" text-anchor="middle" class="tb">ONE LAYER'S EXPERT POOL — 256 of them</text>
  <g fill="#d5dbe3">
    <rect x="510" y="1922" width="30" height="30" rx="6"/><rect x="552" y="1922" width="30" height="30" rx="6"/>
    <rect x="594" y="1922" width="30" height="30" rx="6"/><rect x="636" y="1922" width="30" height="30" rx="6"/>
    <rect x="678" y="1922" width="30" height="30" rx="6"/><rect x="720" y="1922" width="30" height="30" rx="6"/>
    <rect x="762" y="1922" width="30" height="30" rx="6"/><rect x="804" y="1922" width="30" height="30" rx="6"/>
    <rect x="846" y="1922" width="30" height="30" rx="6"/><rect x="888" y="1922" width="30" height="30" rx="6"/>
    <rect x="930" y="1922" width="30" height="30" rx="6"/><rect x="972" y="1922" width="30" height="30" rx="6"/>
    <rect x="1014" y="1922" width="30" height="30" rx="6"/><rect x="1056" y="1922" width="30" height="30" rx="6"/>
  </g>
  <g fill="#e5484d">
    <rect x="594" y="1922" width="30" height="30" rx="6"/><rect x="720" y="1922" width="30" height="30" rx="6"/>
    <rect x="846" y="1922" width="30" height="30" rx="6"/><rect x="972" y="1922" width="30" height="30" rx="6"/>
  </g>
  <text x="1098" y="1944" class="sub" fill="#94a3b8">…</text>
  <text x="802" y="1986" text-anchor="middle" class="sub">red: the ones this token woke · grey: the ones it did not</text>
  <text x="802" y="2018" text-anchor="middle" class="sub">the cache holds 64 of them, and a first touch can never be cached away</text>

  <!-- ══ legend ══════════════════════════════════════════════════════════ -->
  <rect x="34" y="2112" width="1132" height="60" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <g class="lg">
    <circle cx="76"  cy="2142" r="8" fill="#8b5cf6"/><text x="94"  y="2148">client / state</text>
    <circle cx="250" cy="2142" r="8" fill="#5b8def"/><text x="268" y="2148">pipeline</text>
    <circle cx="386" cy="2142" r="8" fill="#f0a72a"/><text x="404" y="2148">layer internals</text>
    <circle cx="562" cy="2142" r="8" fill="#e5484d"/><text x="580" y="2148">experts</text>
    <circle cx="686" cy="2142" r="8" fill="#e8590c"/><text x="704" y="2148">crossing the boundary</text>
    <circle cx="866" cy="2142" r="8" fill="#0f766e"/><text x="884" y="2148">optional</text>
    <circle cx="978" cy="2142" r="8" fill="#94a3b8"/><text x="996" y="2148">storage</text>
    <circle cx="1084" cy="2142" r="8" fill="#2f9e5e"/><text x="1102" y="2148">measured</text>
  </g>

  <text x="600" y="2198" text-anchor="middle" class="sub" fill="#94a3b8">measured 2026-08-07/09 · one RTX 5090, 63.4 GB RAM, one NVMe · -c 200000 -ngl 99 -np 1 --moe-stream --moe-stream-cache 64s --moe-stream-l2 32</text>
</svg>
