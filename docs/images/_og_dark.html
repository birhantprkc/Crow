    linear-gradient(96deg,var(--bg) 0%,var(--bg) 20%,
      color-mix(in srgb,var(--bg) 64%,transparent) 42%,
      color-mix(in srgb,var(--bg) 26%,transparent) 100%),

  /* ---------- linke Spalte, Kante 96px, Wortmarke optisch auf 92px ---------- */
  /* Der Grund ist absichtlich lesbar. Damit die Vordergrundschrift trotzdem
     steht, bekommt sie einen Hof aus der Grundfarbe statt eines Kastens. */
  .lift{text-shadow:0 0 18px var(--bg),0 0 8px var(--bg),0 0 3px var(--bg)}

  .mark{position:absolute;left:92px;top:104px;font-weight:200;font-size:88px;
        line-height:88px;letter-spacing:18px;color:var(--text-strong);z-index:2}
  .role{position:absolute;left:96px;top:224px;font-weight:400;font-size:14px;
        line-height:14px;letter-spacing:7px;color:var(--dim);z-index:2}

  .panel{position:absolute;left:96px;width:544px;top:328px;z-index:2}

  .pendbar{padding:9px 13px 22px;margin:0 0 -14px;border-radius:10px;
    border:1px solid color-mix(in srgb,var(--accent) 32%,transparent);
    color:var(--accent);font-size:12px;
    background:linear-gradient(90deg,transparent 0%,color-mix(in srgb,var(--accent) 20%,transparent) 50%,transparent 100%),var(--raised)}
  .pendbar .top{display:flex;align-items:center;gap:9px}
  .pendbar .title{font-weight:600}
  .pendbar .plus{color:var(--ok);font-variant-numeric:tabular-nums}
  .pendbar .minus{color:var(--bad);font-variant-numeric:tabular-nums}
  .pendbar .hint{color:var(--dimmer);margin-left:auto;font-size:11px}

  .box{position:relative;z-index:1;border:1px solid var(--accent);border-radius:10px;
