[package]
name = "crowsetup-core"
version = "0.1.0"
edition = "2024"

[dependencies]
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
ureq = "3.4.2"
zip = "8.6.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_SystemInformation"] }

# Linux (#342): the packages are .tar.gz, disk and RAM come from libc.
[target.'cfg(unix)'.dependencies]
flate2 = "1.1.10"
libc = "0.2.189"
tar = { version = "0.4.46", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
tiny_http = "0.12.0"
