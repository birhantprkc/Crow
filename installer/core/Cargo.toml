[package]
name = "crowsetup-core"
version = "0.1.0"
edition = "2024"

[dependencies]
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# #340: ComfyUI ships as a solid LZMA2 + BCJ2 7z; decoding only, one thread
# (24 threads peaked at 10.2 GB on its 1.99 GB archive, one at 806 MB, 40.9 s).
sevenz-rust2 = { version = "=0.23.0", default-features = false }
sha2 = "0.11.0"
thiserror = "2.0.21"
ureq = "3.4.2"
zip = "8.6.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_SystemInformation"] }

# Linux (#342): the packages are .tar.gz, disk and RAM come from libc.
[target.'cfg(unix)'.dependencies]
flate2 = "1.1.10"
libc = "0.2.189"
tar = { version = "0.4.46", default-features = false }

[dev-dependencies]
# builds the small test archives
sevenz-rust2 = { version = "=0.23.0", default-features = false, features = ["compress"] }
tempfile = "3.27.0"
tiny_http = "0.12.0"
