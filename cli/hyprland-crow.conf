# Hyprland rules for Crow's window, for a Hyprland that reads an INI config.
# The installer copies this to ~/.config/hypr/crow.conf and appends
# `source = ~/.config/hypr/crow.conf` to hyprland.conf if it is not already
# sourced.
#
# THE OTHER DIALECT IS cli/hyprland-crow.lua, and it is not a second opinion but
# the same rules for the other parser: Hyprland picks its parser from the config
# it finds, `hyprland.conf` gets this syntax and `hyprland.lua` gets
# `hl.window_rule{...}`. Measured 2026-09-16 on 0.56.2 with a Lua config:
# `hyprctl keyword windowrule "float, class:^(crow)$"` answered
# "keyword can't work with non-legacy parsers. Use eval." The installer ships
# whichever file matches what the user already has. Both are kept in step.
#
# WHY THE CLIENT CANNOT DO THIS ITSELF, and it is not an oversight to fix
# later. On Wayland a client may not place, size or raise its own toplevel:
# there are no global coordinates, `gtk_window_move()` is a documented no-op,
# and `set_keep_above()` does nothing. Measured 2026-09-16 with `hyprctl
# clients -j`: a window created with `width=500, height=250` came up as
# `size=[1261,688] floating=false`, tiled into the layout, and `move(150,150)`
# changed nothing. The compositor owns the frame; a rule is how you talk to it.
#
# FLOAT IS THE ONE THAT MATTERS. Crow is a frameless window whose layout has a
# hard minimum -- 520 px of rail plus 560 px of chat plus 50 px of column
# chrome, see the comment above `min_size` in cli/crow_gui.py -- and a tiling
# workspace hands out whatever is left after everything else. Tiled at a third
# of a screen the mask does not fit and the composer is the first thing to go.
#
# The class is `crow`, set by `GLib.set_prgname("crow")` in cli/crow_gui.py
# before the window opens. The same string is `StartupWMClass` in crow.desktop.
#
# AND `Crow` WITH A CAPITAL C, because of the escape hatch. Started with
# `CROW_GDK_BACKEND=x11` the window goes through XWayland, and there the identity
# is the X11 WM_CLASS -- whose res_class GTK capitalises. Measured 2026-09-16:
# `hyprctl clients -j` reports `class: "crow"` on Wayland and `class: "Crow"`,
# `xwayland: true` under the hatch. One character, and without it the rules
# silently stop applying on exactly the run somebody is already debugging.
windowrule = float, class:^([Cc]row)$
windowrule = size 1180 800, class:^([Cc]row)$
windowrule = center, class:^([Cc]row)$

# NO BORDER AND NO ROUNDING FROM THE COMPOSITOR, because the window draws both
# itself: it is frameless, the title bar is part of the page, and a second
# border around a design that already has one reads as a mistake.
windowrule = noborder, class:^([Cc]row)$
windowrule = rounding 0, class:^([Cc]row)$

# AND THE DESKTOP DOES NOT SHINE THROUGH IT. A setup that dims unfocused windows
# -- Omarchy paints every window at 0.985/0.96 -- is a nice effect on a terminal
# and the wrong one here: Crow is frameless, its chrome IS the page, and a chat
# you can read the wallpaper through stops looking like a program and starts
# looking like a layer. Delete this line if you want the effect back.
windowrule = opacity 1.0 1.0, class:^([Cc]row)$

# THE BROWSER PANE IS NOT A WINDOW ANY MORE (#201). It is a second WebKitWebView
# inside Crow's GtkWindow, placed by a GtkOverlay (see `InWindowPane` in
# cli/crow_gui.py), so no rule here applies to it. As a separate toplevel it
# carried this same class and the float/center/size rules above made it a
# second 1180x800 window centred over Crow. CROW_PANE_WINDOW=1 brings that back
# for a comparison; the rules then catch it as before.
