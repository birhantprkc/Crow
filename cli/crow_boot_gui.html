<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crow</title>
<!--
  The operating-point window (#196), cli/crow_boot_gui.py's page. The design
  is the installer's (installer/ui/index.html: Crow's tokens, the spaced CROW
  wordmark, the crow from cli/mark-on-dark.svg, rows, the composer bar).
  It draws Controller.view() and sends button presses back; it decides
  nothing. crow_boot_gui.py inlines the crow; opened as a file, the page draws
  whatever window.crowBoot.render(view) is handed.
-->
<style>
:root{
  --bg:#181818; --rail:#141414; --raised:#2a2a2b; --hover:#2a2a2b;
  --line:#2e2e30; --line-soft:#242426;
  --text:#f2f2f3; --soft:#c9c9cc; --dim:#a3a3a6; --dimmer:#6f6f73;
  --acc:#5b8def; --acc-line:#3d63b8; --composer:#1c1c1d;
  --ok:#4ec98f; --warn:#e3b341; --bad:#f0655a; --close-bg:#c0362b;
  --run-line:#2f4a78; --run-bg:#1b2230; --stop-line:#6b3a36; --stop-text:#f0a49d; --warn-bg:#221f17;
  --ui:system-ui,"Segoe UI",-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --col:460px; --bar:540px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font:13px/1.45 var(--ui);overflow:hidden;
  user-select:none;-webkit-user-select:none;cursor:default}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}

.app{height:100vh;display:flex;flex-direction:column;border:1px solid #2b2b2e}
.top{height:32px;flex:none;display:flex;align-items:stretch;background:var(--rail)}
.drag{flex:1;display:flex;align-items:center;gap:14px;padding-left:14px}
.wm{font-weight:800;letter-spacing:.22em;font-size:11px}
.menu{color:var(--dim);font-size:11px}
.ctl{display:flex}
.ctl button{width:46px;display:grid;place-items:center;color:var(--dimmer);border-radius:0}
.ctl button:hover{background:var(--hover);color:var(--text)}
.ctl button.x:hover{background:var(--close-bg);color:#fff}
.ctl svg{width:10px;height:10px;stroke:currentColor;stroke-width:1;fill:none;shape-rendering:crispEdges}

.center{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:30px 32px 16px}
.scroll{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;overflow-y:auto;scrollbar-gutter:stable both-edges}
.scroll::-webkit-scrollbar{width:8px}
.scroll::-webkit-scrollbar-button{display:none}
.scroll::-webkit-scrollbar-track{background:transparent}
.scroll::-webkit-scrollbar-thumb{background:#3a3a3d;border-radius:4px}
.mark{position:relative;width:104px;height:104px;flex:none}
.mark img{position:absolute;inset:0;width:100%;height:100%;-webkit-user-drag:none}
.mark .ghost{opacity:.10}
.say{color:var(--soft);font-size:16px;margin:22px 0 12px;text-align:center;font-variant-numeric:tabular-nums}
.list{width:100%;max-width:var(--col)}
.row{display:flex;align-items:center;gap:14px;padding:8px 0;border-top:1px solid var(--line-soft)}
.row .tx{flex:1;min-width:0}
.row b{font-weight:600}
.row .d{color:var(--dim)}
.row.off b,.row.off .d{color:var(--dimmer)}
.row.opt b{color:var(--dim);font-weight:500}
.row.opt .d{color:var(--dimmer)}
.sec{width:100%;max-width:var(--col);color:var(--dimmer);font-size:11.5px;padding:10px 0 3px}
.go{border:1px solid var(--line);border-radius:6px;padding:3px 11px;color:var(--soft);font-size:12px;white-space:nowrap;flex:none}
.go:hover{border-color:#4a4a4e;color:var(--text)}
.go.dis{opacity:.35}
.go.dis:hover{border-color:var(--line);color:var(--soft)}
.run{width:100%;max-width:var(--col);display:flex;align-items:center;gap:12px;padding:9px 12px;
  border:1px solid var(--run-line);border-radius:8px;background:var(--run-bg);margin-bottom:6px}
.run .tx{flex:1;min-width:0}
.run b{font-weight:600}
.run .d{color:var(--dim)}
.stop{border:1px solid var(--stop-line);color:var(--stop-text);border-radius:6px;padding:3px 11px;font-size:12px;flex:none}
.stop:hover{border-color:#8a4a44}
.stop:disabled{opacity:.4}
.msg{width:100%;max-width:var(--col);border-left:2px solid var(--warn);padding:6px 10px;color:var(--soft);
  background:var(--warn-bg);margin:6px 0}
.msg .d{color:var(--soft)}
.msg.bad{border-left-color:var(--bad)}
.msg .d.small{color:var(--dim);font-size:12px;overflow-wrap:anywhere}

.bar{width:100%;max-width:var(--bar);flex:none;margin-top:12px;border:1px solid var(--acc-line);border-radius:10px;
  padding:8px 10px 8px 14px;display:flex;align-items:center;gap:10px;background:var(--composer)}
.path{flex:1;min-width:0;color:var(--dim);font-size:12.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip{border:1px solid var(--line);border-radius:6px;padding:2px 9px;color:var(--soft);font-size:12px;flex:none}
.chip:hover{border-color:#4a4a4e;color:var(--text)}
.btn{background:var(--acc);color:#fff;font-weight:600;border-radius:6px;padding:6px 18px;flex:none}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;filter:none}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="drag pywebview-drag-region" data-dbl="maximise"><span class="wm">CROW</span><span class="menu">Operating points</span></div>
    <div class="ctl">
      <button data-act="minimise" aria-label="Minimise" title="Minimise"><svg viewBox="0 0 10 10"><path d="M0 5.5h10"/></svg></button>
      <button data-act="maximise" aria-label="Maximise" title="Maximise"><svg viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9"/></svg></button>
      <button data-act="close" class="x" aria-label="Close" title="Close"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10"/></svg></button>
    </div>
  </div>
  <div class="center" id="center"></div>
</div>
<script>
(function () {
  'use strict';
  var LOGO = 'mark-on-dark.svg';
  var POLL_MS = 250;
  var last = '';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function mark(fill) {
    if (fill == null) return '<div class="mark"><img src="' + LOGO + '" alt="Crow"></div>';
    return '<div class="mark"><img class="ghost" src="' + LOGO + '" alt="">' +
      '<img src="' + LOGO + '" alt="Crow" style="clip-path:inset(0 ' + (100 - fill) + '% 0 0)"></div>';
  }
  function row(r) {
    return '<div class="row' + (r.cls ? ' ' + r.cls : '') + '"><div class="tx"><b>' + esc(r.title) + '</b>' +
      '<div class="d">' + esc(r.detail) + '</div></div>' +
      '<button class="go' + (r.dim ? ' dis' : '') + '" data-act="start" data-id="' + esc(r.id) + '"' +
      (r.enabled ? '' : ' disabled') + ' aria-label="Start ' + esc(r.title) + '">Start</button></div>';
  }
  function msg(m, cls) {
    return '<div class="msg' + (cls ? ' ' + cls : '') + '">' + esc(m.title) +
      (m.detail ? '<div class="d' + (cls ? ' small' : '') + '">' + esc(m.detail) + '</div>' : '') + '</div>';
  }

  function render(v) {
    var h = mark(v.fill) + '<div class="say">' + esc(v.say) + '</div>';
    if (v.running) {
      h += '<div class="run"><div class="tx"><b>' + esc(v.running.title) + '</b><div class="d">' +
        esc(v.running.detail) + '</div></div><button class="stop" data-act="stop"' +
        (v.running.stop ? '' : ' disabled') + '>Stop</button></div>';
    }
    if (v.warn) h += msg(v.warn, '');
    if (v.note) h += msg(v.note, 'bad');
    if (v.rows.length) h += '<div class="list">' + v.rows.map(row).join('') + '</div>';
    if (v.optional.length) {
      h += '<div class="sec">Optional (llama.cpp)</div><div class="list">' + v.optional.map(row).join('') + '</div>';
    }
    var b = v.bar.button;
    var tail = '<button class="' + b.kind + '" data-act="' + esc(b.act) + '"' + (b.enabled ? '' : ' disabled') +
      '>' + esc(b.label) + '</button>';
    document.getElementById('center').innerHTML = '<div class="scroll">' + h + '</div>' +
      '<div class="bar"><span class="path" title="' + esc(v.bar.text) + '">' + esc(v.bar.text) + '</span>' + tail + '</div>';
  }
  function draw(v) {
    var s = JSON.stringify(v);
    if (s === last) return;
    last = s;
    render(v);
  }

  function api() { return window.pywebview && window.pywebview.api; }
  function poll() {
    var a = api();
    if (!a) return;
    a.view().then(draw, function () { /* the next poll tries again */ });
  }
  function act(name, id) {
    var a = api();
    if (!a || !a[name]) return;
    var done = id == null ? a[name]() : a[name](id);
    if (done && done.then) done.then(poll, poll);
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('button[data-act]');
    if (t && !t.disabled) act(t.dataset.act, t.dataset.id == null ? null : t.dataset.id);
  });
  document.addEventListener('dblclick', function (e) {
    if (e.target.closest('[data-dbl]')) act('maximise', null);
  });
  window.addEventListener('pywebviewready', function () {
    poll();
    setInterval(poll, POLL_MS);
  });
  window.crowBoot = { render: draw };
})();
</script>
</body>
</html>
